name: iOS Lite

on:
  push:
    branches: [ios-lite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-lite
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_app_build.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/lite_app_test.dart test/player_screen_test.dart test/diary_service_test.dart --dart-define=LITE=true --dart-define=ALL_SOURCES=true --dart-define=DISABLE_REMOTE_IMAGES=true
      - run: go test -race -run '^Test(NativeLite|NativeStream|HuangguoAI|LegacyAPIProbe)' -ldflags='-X duanjuapp/native/core.buildAllSources=true -X duanjuapp/native/core.buildLite=true' ./core
        working-directory: native

  ios:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: python scripts/build_ios.py --lite
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-lite-ios
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
